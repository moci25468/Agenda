services:
  redis:
    image: redis:7-alpine
    container_name: qut-campus-assistant-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"

  campus-assistant:
    build: .
    container_name: qut-campus-assistant
    depends_on:
      - redis
    restart: unless-stopped
    ports:
      # 只绑定回环地址：本项目 API 默认无鉴权且配置内含门户 Cookie，
      # 不要改成 "8300:8300" 直接暴露公网。需要外网访问请用 SSH 隧道或 nginx + Basic Auth。
      - "127.0.0.1:8300:8300"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - CAMPUS_DATA_DIR=/data
      - REDIS_URL=redis://redis:6379/0
      - AGENDA_CACHE_PREFIX=agenda:v1
      - REDIS_TIMEOUT=0.25
      - AGENDA_ROOMS_SHARED_SEMESTER_START=${AGENDA_ROOMS_SHARED_SEMESTER_START:-}
      - AGENDA_ROOMS_SHARED_COOKIE=${AGENDA_ROOMS_SHARED_COOKIE:-}
      - AGENDA_ROOMS_SHARE_ON_DEMAND=${AGENDA_ROOMS_SHARE_ON_DEMAND:-0}